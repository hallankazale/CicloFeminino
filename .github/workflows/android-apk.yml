name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk-capacitor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate native Luna launcher icons
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          base64 --decode assets/luna-icon.jpg.b64 > /tmp/luna-source.jpg

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          src = Image.open('/tmp/luna-source.jpg').convert('RGBA')
          res = Path('android/app/src/main/res')
          sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }

          # Legacy launcher icons: actual PNG files in Android's canonical mipmap folders.
          for density, size in sizes.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              for old in folder.glob('ic_launcher*'):
                  old.unlink()
              icon = ImageOps.fit(src, (size, size), method=Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', 'PNG', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', 'PNG', optimize=True)

          # Adaptive foreground. Keep the full Luna artwork inside Android's safe zone.
          drawable = res / 'drawable-nodpi'
          drawable.mkdir(parents=True, exist_ok=True)
          canvas = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          art = ImageOps.fit(src, (324, 324), method=Image.Resampling.LANCZOS)
          canvas.alpha_composite(art, ((432-324)//2, (432-324)//2))
          canvas.save(drawable / 'luna_foreground.png', 'PNG', optimize=True)
          PY

          RES=android/app/src/main/res
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"

          cat > "$RES/values/luna_icon_colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="luna_icon_background">#252858</color>
          </resources>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/luna_icon_background" />
              <foreground android:drawable="@drawable/luna_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"

          # Force Android/package manager to treat this as a newer build.
          sed -i 's/versionCode [0-9][0-9]*/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.2"/' android/app/build.gradle

          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          test -s "$RES/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$RES/drawable-nodpi/luna_foreground.png"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Luna-Ciclo-Feminino-v1.0.2.apk

      - name: Verify APK contains Luna resources
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/Luna-Ciclo-Feminino-v1.0.2.apk
          unzip -l "$APK" | grep -q 'res/drawable-nodpi-v4/luna_foreground.png'
          unzip -l "$APK" | grep -q 'res/mipmap-xxxhdpi-v4/ic_launcher.png'
          echo 'APK validated with Luna launcher resources.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Ciclo-Feminino-v1.0.2-ICON-FIXED
          path: android/app/build/outputs/apk/debug/Luna-Ciclo-Feminino-v1.0.2.apk
          if-no-files-found: error
          retention-days: 14
