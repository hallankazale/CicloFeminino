name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk-capacitor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Luna launcher icon
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          MANIFEST=android/app/src/main/AndroidManifest.xml
          ICON="$RES/drawable-nodpi/luna_icon.jpg"

          mkdir -p "$RES/drawable-nodpi"
          base64 --decode assets/luna-icon.jpg.b64 > "$ICON"
          test -s "$ICON"

          # Use the Luna artwork directly as the launcher resource.
          sed -i 's#android:icon="[^"]*"#android:icon="@drawable/luna_icon"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then
            sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@drawable/luna_icon"#' "$MANIFEST"
          else
            sed -i 's#<application #<application android:roundIcon="@drawable/luna_icon" #' "$MANIFEST"
          fi

          # Remove generated adaptive launcher definitions so they cannot override the artwork.
          rm -f "$RES"/mipmap-anydpi-v26/ic_launcher.xml "$RES"/mipmap-anydpi-v26/ic_launcher_round.xml

          echo 'Launcher entries in final manifest:'
          grep -o 'android:\(icon\|roundIcon\)="[^"]*"' "$MANIFEST"
          grep -q 'android:icon="@drawable/luna_icon"' "$MANIFEST"
          grep -q 'android:roundIcon="@drawable/luna_icon"' "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-ciclo-feminino-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
